<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07112f">
  <meta name="description" content="Convert Celsius, Kelvin, Fahrenheit and Rankine instantly as you type with Tempo.">
  <title>Tempo — Live Temperature Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/script.js" defer></script>
</head>
<body class="converter-app">
  <main class="app-frame">
    <header class="app-header">
      <a class="app-menu" href="#converter" aria-label="Go to converter"><i data-lucide="menu"></i></a>
      <a class="app-brand" href="#" aria-label="Tempo home">
        <span class="app-brand-icon"><i data-lucide="thermometer"></i></span>
        <span><strong>Tempo</strong><small>Temperature Converter</small></span>
      </a>
      <button class="app-info" id="info-button" type="button" aria-label="About temperature conversion"><i data-lucide="info"></i></button>
    </header>

    <section class="app-intro" id="converter">
      <span class="intro-kicker">LIVE CONVERSION</span>
      <h1>Get Started</h1>
      <p>Temperature Conversions with Ease</p>
    </section>

    <section class="converter-panel" aria-label="Live temperature converter">
      <div class="unit-field unit-celsius">
        <label for="celsius">Celsius <span class="unit-mark">°C</span></label>
        <div class="unit-input-wrap">
          <input id="celsius" data-unit="celsius" type="text" inputmode="decimal" autocomplete="off" placeholder="Enter Value" aria-describedby="form-message">
          <span>°C</span>
        </div>
      </div>

      <div class="unit-field unit-kelvin">
        <label for="kelvin">Kelvin <span class="unit-mark">K</span></label>
        <div class="unit-input-wrap">
          <input id="kelvin" data-unit="kelvin" type="text" inputmode="decimal" autocomplete="off" placeholder="Enter Value" aria-describedby="form-message">
          <span>K</span>
        </div>
      </div>

      <div class="unit-field unit-fahrenheit">
        <label for="fahrenheit">Fahrenheit <span class="unit-mark">°F</span></label>
        <div class="unit-input-wrap">
          <input id="fahrenheit" data-unit="fahrenheit" type="text" inputmode="decimal" autocomplete="off" placeholder="Enter Value" aria-describedby="form-message">
          <span>°F</span>
        </div>
      </div>

      <div class="unit-field unit-rankine">
        <label for="rankine">Rankine <span class="unit-mark">°R</span></label>
        <div class="unit-input-wrap">
          <input id="rankine" data-unit="rankine" type="text" inputmode="decimal" autocomplete="off" placeholder="Enter Value" aria-describedby="form-message">
          <span>°R</span>
        </div>
      </div>

      <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>

      <div class="tool-actions" aria-label="Converter actions">
        <button type="button" id="reset-button" aria-label="Clear all values" title="Clear all"><i data-lucide="trash-2"></i></button>
        <button type="button" id="copy-button" aria-label="Copy all conversions" title="Copy results"><i data-lucide="copy"></i></button>
        <button type="button" id="download-button" aria-label="Download conversion results" title="Download results"><i data-lucide="download"></i></button>
      </div>
      <p class="action-feedback" id="action-feedback" aria-live="polite"></p>
    </section>

    <aside class="info-note" id="info-note" hidden>
      <i data-lucide="lightbulb"></i>
      <p>Type a value into any scale. The other three temperatures update instantly. You can edit any field to convert in the opposite direction.</p>
    </aside>

    <footer class="app-footer">
      <span>FOUR SCALES. ONE SIMPLE CONVERTER.</span>
      <span>POWERED BY TEMPO</span>
    </footer>
  </main>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
